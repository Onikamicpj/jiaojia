<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>胶价雷达 · 查官价，算几算</title>
<style>
:root {
  --bg: #0a0b0d;
  --surface: #121419;
  --surface-2: #171a20;
  --line: rgba(255, 255, 255, 0.07);
  --line-2: rgba(255, 255, 255, 0.14);
  --text: #e8e9ec;
  --dim: #8a8f98;
  --faint: #5c6169;
  --accent: #ff6b35;
  --cyan: #3dd6c4;
  --good: #3dd6c4;
  --normal: #d8d2c4;
  --high: #f5a623;
  --bad: #ff5a5a;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

body {
  min-height: 100vh;
  background-image:
    radial-gradient(circle at 15% -8%, rgba(255, 107, 53, 0.08), transparent 42%),
    radial-gradient(circle at 88% 2%, rgba(61, 214, 196, 0.05), transparent 38%);
  background-repeat: no-repeat;
}

/* ---------- 顶栏 ---------- */

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 15px 32px;
  border-bottom: 1px solid var(--line);
}

.brand { display: flex; align-items: center; gap: 9px; text-decoration: none; color: inherit; }
.brand-mark { width: 9px; height: 9px; border-radius: 2px; background: var(--accent); }
.brand-name { font-size: 15px; font-weight: 600; letter-spacing: 0.02em; }

.topbar-right { display: flex; align-items: center; gap: 18px; font-variant-numeric: tabular-nums; }
.fxbox { display: flex; align-items: baseline; gap: 6px; }
.fx-label { font-size: 10px; letter-spacing: 0.12em; color: var(--faint); }
.fx-value { font-size: 14px; font-weight: 600; color: var(--cyan); }
.dbinfo { font-size: 11px; color: var(--faint); }

/* ---------- 主区 ---------- */

.shell { max-width: 860px; margin: 0 auto; padding: 50px 28px 90px; }

.hero { margin-bottom: 26px; }

.hero h1 {
  margin: 0 0 10px;
  font-size: 32px;
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.22;
}
.hero h1 em { font-style: normal; color: var(--accent); }

.lede { margin: 0 0 22px; color: var(--dim); font-size: 13.5px; line-height: 1.75; max-width: 620px; }

.searchbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 6px 6px 16px;
  background: var(--surface);
  border: 1px solid var(--line-2);
  border-radius: 12px;
  transition: border-color 0.18s, background 0.18s;
}
.searchbar:focus-within { border-color: rgba(255, 107, 53, 0.6); background: var(--surface-2); }
.searchbar svg { width: 17px; height: 17px; stroke: var(--faint); fill: none; stroke-width: 1.9; flex: none; }

.searchbar input {
  flex: 1;
  min-width: 0;
  padding: 12px 0;
  background: transparent;
  border: 0;
  outline: 0;
  color: var(--text);
  font-size: 16px;
  font-family: inherit;
}
.searchbar input::placeholder { color: var(--faint); font-size: 14px; }

.searchbar button {
  flex: none;
  padding: 11px 22px;
  border: 0;
  border-radius: 8px;
  background: var(--accent);
  color: #100a06;
  font-size: 14px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: filter 0.15s;
}
.searchbar button:hover { filter: brightness(1.08); }
.searchbar button:disabled { opacity: 0.5; cursor: progress; }

.hotline { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-top: 13px; }
.hot-label { font-size: 11px; color: var(--faint); }
.hot {
  padding: 4px 11px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: transparent;
  color: var(--dim);
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.15s;
}
.hot:hover { color: var(--text); border-color: var(--line-2); }

.status { min-height: 20px; margin-bottom: 14px; font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
.status .err { color: var(--bad); }

/* ---------- 提示 / 空态 ---------- */

.hint, .empty {
  padding: 18px 20px;
  border: 1px dashed var(--line-2);
  border-radius: 12px;
  color: var(--faint);
  font-size: 12.5px;
  line-height: 1.9;
}
.hint p, .empty p { margin: 0 0 5px; }
.hint p:last-child, .empty p:last-child { margin-bottom: 0; }
.hint b, .empty b { color: var(--dim); font-weight: 500; }

/* ---------- 官价卡 ---------- */

.list { display: flex; flex-direction: column; gap: 10px; }

.card {
  padding: 16px 18px 14px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: var(--surface);
  transition: border-color 0.15s;
}
.card:hover { border-color: var(--line-2); }

.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }

.specs { display: flex; flex-wrap: wrap; gap: 5px; }

.spec {
  padding: 1px 6px;
  border: 1px solid var(--line-2);
  border-radius: 3px;
  font-size: 10px;
  letter-spacing: 0.04em;
  color: var(--faint);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.spec-grade { font-weight: 600; }

.card-price { text-align: right; flex: none; font-variant-numeric: tabular-nums; }
.card-price .jpy { font-size: 18px; font-weight: 600; line-height: 1.2; }
.card-price .cny { font-size: 11px; color: var(--faint); }

.card-name {
  margin: 8px 0 0;
  font-size: 14.5px;
  font-weight: 500;
  line-height: 1.45;
  color: var(--text);
  word-break: break-word;
}
.card-meta { margin-top: 3px; font-size: 11px; color: var(--faint); }

/* 核价输入 */

.calc {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 13px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}

.calc-label { font-size: 12px; color: var(--dim); }

.calc-field {
  display: flex;
  align-items: center;
  border: 1px solid var(--line-2);
  border-radius: 8px;
  background: var(--surface-2);
  overflow: hidden;
}
.calc-field:focus-within { border-color: rgba(255, 107, 53, 0.6); }

.calc-cur { padding: 0 2px 0 10px; color: var(--faint); font-size: 13px; }

.calc-input {
  width: 96px;
  padding: 7px 8px;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
  font-variant-numeric: tabular-nums;
}
.calc-input::-webkit-outer-spin-button,
.calc-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.calc-input[type=number] { -moz-appearance: textfield; }

.calc-sel {
  padding: 7px;
  border: 0;
  border-left: 1px solid var(--line);
  outline: 0;
  background: transparent;
  color: var(--dim);
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
}
.calc-sel option { background: #1a1d23; color: var(--text); }

.calc-btn {
  padding: 7px 18px;
  border: 1px solid rgba(255, 107, 53, 0.45);
  border-radius: 8px;
  background: rgba(255, 107, 53, 0.09);
  color: var(--accent);
  font-size: 12.5px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.15s;
}
.calc-btn:hover { background: rgba(255, 107, 53, 0.18); }

/* 核价结果 */

.calc-out:empty { display: none; }

.res { margin-top: 13px; padding-top: 12px; border-top: 1px solid var(--line); }

.res-main { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.res-suan { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.res-suan span { font-size: 11px; font-weight: 400; color: var(--faint); margin-left: 3px; }
.res-grade { font-size: 14px; font-weight: 600; }
.res-say { font-size: 12px; color: var(--dim); }

.res-detail {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 9px;
  font-size: 12px;
  color: var(--dim);
  font-variant-numeric: tabular-nums;
}
.res-detail .dot { color: var(--faint); }

.res-extra { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 6px; font-size: 11.5px; }
.trend.up { color: var(--bad); }
.trend.down { color: var(--good); }
.trend.flat, .trend.first { color: var(--faint); }
.best { color: var(--good); }

.err { margin-top: 11px; font-size: 12px; color: var(--high); }
.loading { margin-top: 11px; font-size: 12px; color: var(--faint); }

.more {
  padding: 11px;
  border: 1px dashed var(--line-2);
  border-radius: 10px;
  background: transparent;
  color: var(--dim);
  font-size: 12.5px;
  font-family: inherit;
  cursor: pointer;
}
.more:hover { color: var(--text); border-color: var(--accent); }

/* ---------- 页脚 ---------- */

.foot { margin-top: 46px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--faint); line-height: 1.85; }
.foot p { margin: 0 0 4px; }
.foot-dim { color: #474b52; }

@media (max-width: 640px) {
  .topbar { padding: 13px 18px; }
  .shell { padding: 30px 18px 60px; }
  .hero h1 { font-size: 25px; }
  .searchbar { padding: 5px 5px 5px 13px; }
  .searchbar button { padding: 10px 16px; }
  .dbinfo { display: none; }
  .calc-input { width: 80px; }
}

</style>
</head>

<header class="topbar">
  <a class="brand" href="/">
    <span class="brand-mark"></span>
    <span class="brand-name">胶价雷达</span>
  </a>
  <div class="topbar-right">
    <div class="fxbox">
      <span class="fx-label">1 円</span>
      <span class="fx-value" id="fxValue">—</span>
      <span class="fx-date" id="fxDate"></span>
    </div>
    <div class="dbinfo" id="dbInfo"></div>
  </div>
</header>

<main class="shell">

  <section class="hero">
    <h1>这个价，<em>值不值</em>？</h1>
    <p class="lede">
      查万代官方定价，填你看到的价，立刻算出几算、比官价贵多少。
      不用管有没有货 —— 只回答一件事：现在买，亏不亏。
    </p>

    <form class="searchbar" id="searchForm" autocomplete="off">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M16.5 16.5L21 21"></path></svg>
      <input id="q" type="search" placeholder="独角兽 / 牛高达 / νガンダム / RX-93 / RG" aria-label="搜索">
      <button type="submit" id="goBtn">查原价</button>
    </form>

    <div class="hotline">
      <span class="hot-label">常查</span>
      <button class="hot" data-q="独角兽">独角兽</button>
      <button class="hot" data-q="牛高达">牛高达</button>
      <button class="hot" data-q="沙扎比">沙扎比</button>
      <button class="hot" data-q="强袭">强袭</button>
      <button class="hot" data-q="能天使">能天使</button>
      <button class="hot" data-q="扎古">扎古</button>
    </div>
  </section>

  <section class="status" id="status"></section>

  <section class="list" id="list">
    <div class="hint">
      <p>官方库存的是日文原名（<b>νガンダム</b> / <b>ユニコーン</b>），中文俗称会先翻译再查。</p>
      <p>搜不到就换型号试试：<b>RX-93</b>、<b>MSN-04</b>、<b>RX-0</b>。</p>
    </div>
  </section>

  <footer class="foot">
    <p>官方定价抓自 bandai-hobby.net 商品页的「価格」字段，汇率来自 ECB（frankfurter.dev）。</p>
    <p class="foot-dim">价格以官网为准，本项目与万代无关联。</p>
  </footer>

</main>

<script>
/* 单文件版运行时：搜索 + 核价，全部在浏览器本地完成 */
(function () {
  const GRADE_COLOR = { HG: '#8a8f98', RG: '#3dd6c4', MG: '#6ea8fe', PG: '#ff6b35', EG: '#8a8f98', FG: '#8a8f98', SD: '#a78bfa' };
  const VERDICT_COLOR = { good: '#3dd6c4', normal: '#d8d2c4', high: '#f5a623', bad: '#ff5a5a' };
  const GRADE_ORDER = { HG: 0, RG: 1, MG: 2, PG: 3, EG: -1, FG: -1, SD: -2 };
  const EXCLUDE_GRADES = { SD: 1, SDW: 1, SDCS: 1, BB: 1, EG: 1, FG: 1 };

  const LIMITED_RE = /限定|ガンダムベース|セブン-イレブン|プレミアムバンダイ|ホビーオンライン|受注|抽選|イベント|記念|特装|豪華版|クリアカラー|メッキ|チタニウム|エクストラフィニッシュ|劇場|初回|GFT|GPB|エコプラ|リサイクル|コーティング/i;
  const ACCESSORY_RE = /用\s*ブースター|ブースターベッド|用\s*ベース|ディスプレイベース|武器セット|オプションパーツ|クリアファイル|ファイル|ポスター|Tシャツ|マグカップ|キーホルダー|ストラップ/;

  const PAGE = 24;
  let allItems = [];
  let shown = PAGE;
  let fx = 0.0424;
  let fxNote = '内置汇率';

  const $ = (id) => document.getElementById(id);

  function normalize(text) {
    return String(text ?? '')
      .replace(/[Ａ-Ｚａ-ｚ０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xfee0))
      .toLowerCase();
  }

  const ALIAS = window.__ALIAS__;
  const ALIAS_KEYS = Object.keys(ALIAS).sort((a, b) => b.length - a.length);

  function translateZh(text) {
    let out = String(text ?? '');
    for (const key of ALIAS_KEYS) {
      const idx = out.toLowerCase().indexOf(key.toLowerCase());
      if (idx >= 0) out = out.slice(0, idx) + ALIAS[key] + out.slice(idx + key.length);
    }
    return out;
  }

  function relevance(name, tokens) {
    const n = normalize(name);
    const bare = n.replace(/（[^）]*）|\([^)]*\)/g, '');
    let score = 0;
    for (const t of tokens) {
      const idx = bare.indexOf(t);
      if (idx === 0) score += 120;                                   // νガンダム 开头
      else if (idx > 0 && /[\s]/.test(bare[idx - 1])) score += 100;   // 前面是空格
      else if (idx > 0 && /[-‐ー]/.test(bare[idx - 1])) score += 70;  // Hi-ν 这种，排后面
      else if (idx > 0) score += 90;
      else if (n.includes(t)) score += 8;                             // 只在括号里命中
    }
    return score;
  }

  function searchItems(query) {
    const translated = translateZh(query);
    const tokens = normalize(translated).split(/\s+/).filter(Boolean);
    if (tokens.length === 0) return [];

    return window.__DATA__.filter((it) => {
      if (EXCLUDE_GRADES[it.g]) return false;
      if (ACCESSORY_RE.test(it.n)) return false;
      if (LIMITED_RE.test(it.n)) return false;
      const hay = normalize(`${it.n} ${it.c || ''} ${it.g || ''} ${it.s || ''}`);
      return tokens.every((t) => hay.includes(t));
    })
      .map((it) => ({ it, score: relevance(it.n, tokens) }))
      .sort((a, b) => {
        if (b.score !== a.score) return b.score - a.score;
        const ga = GRADE_ORDER[a.it.g] ?? 5;
        const gb = GRADE_ORDER[b.it.g] ?? 5;
        if (ga !== gb) return ga - gb;
        return (a.it.p ?? 0) - (b.it.p ?? 0);
      })
      .slice(0, 60)
      .map((x) => x.it);
  }

  function gradeOf(suan) {
    if (suan <= 4.5) return { key: 'good', zh: '好价', say: '低于 4.5 算，可以下手。' };
    if (suan <= 5.5) return { key: 'normal', zh: '正常', say: '正常区间，不着急可以再等等。' };
    if (suan <= 6.5) return { key: 'high', zh: '偏高', say: '偏高了，不是急用建议再等。' };
    return { key: 'bad', zh: '很贵', say: '明显贵了，除非绝版或急用，否则别买。' };
  }

  function fmtJpy(v) {
    return v == null ? '—' : '¥' + Number(v).toLocaleString('ja-JP');
  }

  function fmtCny(v) {
    if (v == null) return '—';
    const d = Number.isInteger(v) ? 0 : v >= 1000 ? 0 : 1;
    return '¥' + Number(v).toLocaleString('zh-CN', { minimumFractionDigits: d, maximumFractionDigits: d });
  }

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  /* ---- 历史（localStorage） ---- */
  function loadHistory() {
    try {
      return JSON.parse(localStorage.getItem('jiaojia-history') || '{}');
    } catch {
      return {};
    }
  }

  function saveHistory(h) {
    try {
      localStorage.setItem('jiaojia-history', JSON.stringify(h));
    } catch {
      /* 隐私模式下可能写不了，忽略 */
    }
  }

  /* ---- 渲染 ---- */

  function cardOf(it) {
    const tags = [];
    if (it.g) {
      const c = GRADE_COLOR[it.g] || '#8a8f98';
      tags.push(`<span class="spec spec-grade" style="color:${c};border-color:${c}44">${esc(it.g)}</span>`);
    }
    if (it.s) tags.push(`<span class="spec">${esc(it.s)}</span>`);
    if (it.c) tags.push(`<span class="spec">${esc(it.c)}</span>`);

    return `<article class="card" data-id="${esc(it.id)}" data-price="${it.p}">
      <div class="card-head">
        <div class="specs">${tags.join('')}</div>
        <div class="card-price">
          <div class="jpy">${fmtJpy(it.p)}</div>
          <div class="cny">≈ ${fmtCny(it.p * fx)}</div>
        </div>
      </div>
      <h3 class="card-name">${esc(it.n)}</h3>
      <div class="card-meta">${esc(it.r || '发售日未标')} · 官方定价</div>

      <div class="calc">
        <span class="calc-label">你看到</span>
        <div class="calc-field">
          <span class="calc-cur">¥</span>
          <input class="calc-input" type="number" inputmode="decimal" min="1" step="1" placeholder="现价">
          <select class="calc-sel">
            <option value="CNY">人民币</option>
            <option value="JPY">日元</option>
          </select>
        </div>
        <button class="calc-btn" type="button">核价</button>
      </div>

      <div class="calc-out"></div>
    </article>`;
  }

  function render(items) {
    const list = $('list');
    if (items.length === 0) {
      list.innerHTML = `<div class="empty">
        <p><b>没查到这一款。</b></p>
        <p>官方库是日文原名，试试 <b>νガンダム</b>、<b>ユニコーン</b>，或直接用型号 <b>RX-93</b>。</p>
      </div>`;
      return;
    }

    const more = items.length > shown ? `<button class="more" type="button">还有 ${items.length - shown} 条，继续加载</button>` : '';
    list.innerHTML = items.slice(0, shown).map(cardOf).join('') + more;
    bindCards();

    const btn = list.querySelector('.more');
    if (btn) {
      btn.addEventListener('click', () => {
        shown += PAGE;
        render(allItems);
      });
    }
  }

  function bindCards() {
    document.querySelectorAll('.card').forEach((card) => {
      const input = card.querySelector('.calc-input');
      const sel = card.querySelector('.calc-sel');
      const run = () => doCheck(card, input.value, sel.value);
      card.querySelector('.calc-btn').addEventListener('click', run);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') run();
      });
    });
  }

  function doCheck(card, rawPrice, currency) {
    const out = card.querySelector('.calc-out');
    const price = Number(rawPrice);
    if (!price || price <= 0) {
      out.innerHTML = '<div class="err">先填你看到的价格</div>';
      return;
    }

    const msrpJpy = Number(card.dataset.price);
    const id = card.dataset.id;

    const cny = currency === 'JPY' ? price * fx : price;
    const msrpCny = msrpJpy * fx;
    const suan = cny / (msrpJpy / 100);
    const g = gradeOf(suan);
    const color = VERDICT_COLOR[g.key];
    const vs = Math.round(((cny / msrpCny) - 1) * 1000) / 10;

    // 记一条历史，用来判断涨跌
    const history = loadHistory();
    const list = history[id] || [];
    const prev = list.length ? list[list.length - 1] : null;
    list.push({ at: new Date().toISOString(), cny: Math.round(cny * 100) / 100, suan: Math.round(suan * 100) / 100 });
    history[id] = list.slice(-40);
    saveHistory(history);

    let trend = '<span class="trend first">首次记录，再核一次就能看涨跌</span>';
    if (prev) {
      const diff = Math.round((suan - prev.suan) * 100) / 100;
      const dir = diff > 0.05 ? 'up' : diff < -0.05 ? 'down' : 'flat';
      const label = dir === 'up' ? '比上次涨' : dir === 'down' ? '比上次降' : '与上次持平';
      trend = `<span class="trend ${dir}">${label} ${Math.abs(diff).toFixed(2)} 算</span>`;
    }

    const best = list.length > 1
      ? `<span class="best">历史最低 ${Math.min(...list.map((x) => x.suan)).toFixed(1)} 算</span>`
      : '';

    out.innerHTML = `<div class="res">
      <div class="res-main">
        <span class="res-suan" style="color:${color}">${suan.toFixed(1)}<span>算</span></span>
        <span class="res-grade" style="color:${color}">${esc(g.zh)}</span>
        <span class="res-say">${esc(g.say)}</span>
      </div>
      <div class="res-detail">
        <span>官价 ${fmtJpy(msrpJpy)} → 折合 ${fmtCny(msrpCny)}</span>
        <span class="dot">·</span>
        <span>你看到 ${fmtCny(cny)}</span>
        <span class="dot">·</span>
        <span style="color:${color}">比官价${vs > 0 ? '贵' : '便宜'} ${Math.abs(vs)}%</span>
      </div>
      <div class="res-extra">${trend}${best}</div>
    </div>`;
  }

  /* ---- 事件 ---- */

  function submit(q) {
    const query = String(q || '').trim();
    if (!query) return;
    allItems = searchItems(query);
    shown = PAGE;
    $('status').textContent = allItems.length ? `「${query}」命中 ${allItems.length} 条` : `「${query}」命中 0 条`;
    render(allItems);
  }

  document.getElementById('searchForm').addEventListener('submit', (e) => {
    e.preventDefault();
    submit($('q').value);
  });

  document.querySelector('.hotline').addEventListener('click', (e) => {
    const btn = e.target.closest('.hot');
    if (!btn) return;
    $('q').value = btn.dataset.q;
    submit(btn.dataset.q);
  });

  $('dbInfo').textContent = `收录 ${window.__DATA__.length.toLocaleString('zh-CN')} 条`;
  $('fxValue').textContent = `${fx.toFixed(4)} CNY`;

  // 支持 file:///.../jiaojia.html#q=独角兽 直接带着搜索词打开
  const hashQ = decodeURIComponent((location.hash.match(/q=([^&]*)/) || [])[1] || '');
  if (hashQ) {
    $('q').value = hashQ;
    submit(hashQ);
  }

  // 汇率：能联网就换成实时值，连不上就用内置的
  fetch('https://api.frankfurter.dev/v1/latest?base=USD&symbols=CNY,JPY')
    .then((r) => r.json())
    .then((d) => {
      if (d?.rates?.JPY && d?.rates?.CNY) {
        fx = d.rates.CNY / d.rates.JPY;
        fxNote = d.date || '实时';
        $('fxValue').textContent = `${fx.toFixed(4)} CNY`;
        $('fxDate').textContent = fxNote;
        if (allItems.length) render(allItems);
      }
    })
    .catch(() => {
      $('fxDate').textContent = '内置汇率（未联网）';
    });
})();

</script>
</body>
</html>
