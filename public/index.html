<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>胶价雷达 · 万代 / 国模 / KO 比价</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark"></span>
    <span class="brand-name">胶价雷达</span>
    <span class="brand-sub">JIAOJIA</span>
  </div>

  <div class="topbar-right">
    <div class="fxbox" id="fxbox">
      <span class="fx-label">JPY → CNY</span>
      <span class="fx-value" id="fxValue">—</span>
      <span class="fx-note" id="fxNote"></span>
    </div>
    <button class="btn" id="refreshBtn" type="button">抓取最新</button>
  </div>
</header>

<main class="shell">

  <section class="intro">
    <h1>一只模型，<em>到底几算</em>？</h1>
    <p class="lede">
      官方定价 × 实时汇率 = 应有价格。你实际付的钱除以日元定价的百分之一，就是「几算」。
      5 算以内算好价，6 算以上该再等等。
    </p>
    <div class="legend">
      <span class="dot good"></span><span>≤4.5 算 好价</span>
      <span class="dot normal"></span><span>4.5–5.5 正常</span>
      <span class="dot high"></span><span>5.5–6.5 偏高</span>
      <span class="dot bad"></span><span>&gt;6.5 很贵</span>
    </div>
  </section>

  <section class="controls">
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M16.5 16.5L21 21"></path></svg>
      <input id="q" type="search" placeholder="搜机体、型号、品牌…  例：ν / 大班 / RG" autocomplete="off">
    </label>
    <div class="chips" id="brandChips"></div>
  </section>

  <div class="statline" id="statline"></div>

  <section class="grid" id="list">
    <div class="loading">正在载入…</div>
  </section>

  <footer class="foot">
    <p>
      数据来源：万代官方定价（人工维护）+ BanzaiHobby 实时目录 + 人工录入（淘宝 / 闲鱼 / 拼多多）。
      国模与 KO 无公开价格接口，靠 CSV 维护。
    </p>
    <p class="foot-dim">报价可能滞后或缺货，购买前请以商家页面为准。本项目与万代、各品牌无关联。</p>
  </footer>

</main>

<script src="/app.js"></script>
</body>
</html>
